[project]
name = "mewtwo-postprocess"
version = "0.1.0"
description = "Python post-processing tools for MewtwoMegaEvo quantum simulation data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "scipy>=1.10",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "matplotlib>=3.3",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["mewtwo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
